const things=[...trees.map(t=>({y:t.y+17,draw:()=>tree(t.x,t.y,t.s)})),...monsters.filter(m=>m.alive).map(m=>({y:m.y,draw:()=>actorSprite(m.x,m.y,m.type,m.dirRow||0,Math.floor(m.phase*5),m.hit>0)})),...drops.map(d=>({y:d.y,draw:()=>{ctx.fillStyle='#f3d46c';ctx.fillRect(d.x-4,d.y-4,8,8);ctx.fillStyle='#fff2a8';ctx.fillRect(d.x-2,d.y-7,4,3)}})),{y:player.y,draw:()=>actorSprite(player.x,player.y,'hero',player.dir,Math.floor(player.frame*7))}].sort((a,b)=>a.y-b.y);
for(const o of things)o.draw();
if(player.attack>0){ctx.strokeStyle='#f6df9c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y-5,35,-.8,1.3);ctx.stroke();ctx.fillStyle='#f2d88a44';ctx.beginPath();ctx.arc(player.x,player.y-5,32,-.8,1.3);ctx.fill()}
ctx.restore()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function showToast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}
function updateHud(){document.getElementById('hp').style.width=player.hp/player.max*100+'%';document.getElementById('hptext').textContent=Math.ceil(player.hp)+'/'+player.max;document.getElementById('gold').textContent=player.gold;document.getElementById('pots').textContent=player.pots;document.getElementById('xp').style.width=player.exp+'%';document.getElementById('xptext').textContent=player.exp+'%';document.getElementById('hint').textContent=target&&target.alive?'目标：'+(target.type==='cat'?'钉耙猫':'半兽人'):'附近有怪物出没';
const b=document.getElementById('target');b.hidden=!(target&&target.alive);if(target&&target.alive){document.getElementById('targetname').textContent=target.type==='cat'?'钉耙猫':'半兽人';document.getElementById('targethp').style.width=target.hp/target.max*100+'%'}}
function attack(power=1){if(player.attack>0.15)return;player.attack=.28;attackFlash=.22;let candidates=monsters.filter(m=>m.alive&&dist(m,player)<62).sort((a,b)=>dist(a,player)-dist(b,player));let m=candidates[0];if(!m){showToast('没有可攻击的目标');return}target=m;m.hp-=power*(26+Math.random()*12);m.hit=.18;m.atk=.3;if(m.hp<=0){m.alive=false;drops.push({x:m.x,y:m.y,kind:'gold',value:8+Math.floor(rand()*18),life:18});if(rand()<.35)drops.push({x:m.x+12,y:m.y+8,kind:'potion',life:18});player.exp=Math.min(100,player.exp+8);if(player.exp>=100){player.exp=0;showToast('等级提升！Lv.8')}else showToast('击败怪物 · 经验 +8')}else showToast('命中！');updateHud()}
function update(dt){let dx=0,dy=0;if(keys.w||keys.ArrowUp)dy--;if(keys.s||keys.ArrowDown)dy++;if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;if(pointer){let a=pointer.x-player.x,b=pointer.y-player.y,l=Math.hypot(a,b);if(l>14){dx=a/l;dy=b/l}else pointer=null}
let l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;const step=115*dt;const blocked=(x,y)=>{if(tileAt(Math.floor(x/TILE),Math.floor(y/TILE))===5)return true;for(const t of trees)if(Math.hypot(x-t.x,y-(t.y+10))<15*t.s)return true;for(const r of rocks)if(Math.hypot(x-r.x,y-r.y)<15*r.s)return true;return false};if(!blocked(player.x+dx*step,player.y))player.x+=dx*step;if(!blocked(player.x,player.y+dy*step))player.y+=dy*step;player.frame+=dt*8;if(dx)player.dir=dx>0?1:-1;player.dirRow=Math.abs(dy)>Math.abs(dx)?(dy>0?0:3):(dx<0?1:2)}
player.x=clamp(player.x,40,MW*TILE-40);player.y=clamp(player.y,40,MH*TILE-40);player.attack=Math.max(0,player.attack-dt);skillCd=Math.max(0,skillCd-dt);attackFlash=Math.max(0,attackFlash-dt);
for(const m of monsters){if(!m.alive)continue;m.phase+=dt*4;m.hit=Math.max(0,m.hit-dt);m.atk=Math.max(0,m.atk-dt);let d=dist(m,player);if(d<190&&d>27){let vx=(player.x-m.x)/d,vy=(player.y-m.y)/d;m.dirRow=Math.abs(vy)>Math.abs(vx)?(vy>0?0:3):(vx<0?1:2);m.x+=vx*36*dt;m.y+=vy*36*dt}else if(d>220){let h=Math.hypot(m.homeX-m.x,m.homeY-m.y);if(h>5){m.x+=(m.homeX-m.x)/h*18*dt;m.y+=(m.homeY-m.y)/h*18*dt}}else if(d<28&&m.atk<=0){m.atk=1.2;player.hp=Math.max(0,player.hp-7);if(player.hp===0){player.hp=player.max;player.x=15*TILE;player.y=27*TILE;showToast('你已回到安全区域') }updateHud()}}
for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.life-=dt;if(dist(d,player)<25){if(d.kind==='gold'){player.gold+=d.value;showToast('拾取金币 +'+d.value)}else{player.pots++;showToast('拾取金创药')}drops.splice(i,1);updateHud()}else if(d.life<=0)drops.splice(i,1)}
camX=clamp(player.x-W/2,0,MW*TILE-W);camY=clamp(player.y-H/2,0,MH*TILE-H);
}
function drawMini(){mini.clearRect(0,0,76,76);mini.fillStyle='#506d3b';mini.fillRect(0,0,76,76);for(let y=0;y<MH;y+=2)for(let x=0;x<MW;x+=2){let t=tileAt(x,y);if(t===4){mini.fillStyle='#a58a5a';mini.fillRect(x/MW*76,y/MH*76,3,3)}if(t===5){mini.fillStyle='#477e83';mini.fillRect(x/MW*76,y/MH*76,3,3)}}mini.fillStyle='#e4d18a';mini.fillRect(player.x/(MW*TILE)*76-2,player.y/(MH*TILE)*76-2,4,4);mini.fillStyle='#a84a35';for(let m of monsters)if(m.alive)mini.fillRect(m.x/(MW*TILE)*76,m.y/(MH*TILE)*76,2,2)}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);ctx.clearRect(0,0,W,H);drawWorld();drawMini();document.getElementById('coords').textContent='比奇城外 · '+Math.floor(player.x/TILE)+','+Math.floor(player.y/TILE);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();attack()} });addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;let wx=sx+camX,wy=sy+camY;let m=monsters.filter(m=>m.alive&&Math.hypot(m.x-wx,m.y-wy)<35).sort((a,b)=>dist(a,player)-dist(b,player))[0];if(m){target=m;if(dist(m,player)<65)attack();else pointer={x:m.x,y:m.y}}else pointer={x:wx,y:wy}});
document.getElementById('attack').onclick=()=>attack();document.getElementById('skill').onclick=()=>{if(skillCd>0){showToast('技能冷却中');return}skillCd=4;player.attack=0;let hits=monsters.filter(m=>m.alive&&dist(m,player)<105);if(!hits.length){showToast('周围没有敌人');return}hits.forEach(m=>{m.hp-=55;m.hit=.2;if(m.hp<=0){m.alive=false;drops.push({x:m.x,y:m.y,kind:'gold',value:15,life:18})}});showToast('半月弯刀！');updateHud()};
document.getElementById('potion').onclick=()=>{if(!player.pots){showToast('金创药不足');return}if(player.hp>=player.max){showToast('生命值已满');return}player.pots--;player.hp=Math.min(player.max,player.hp+100);showToast('使用金创药，恢复生命');updateHud()};
const joy=document.getElementById('joy'),nub=document.getElementById('nub');let joyId=null;joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});function moveJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-56,y=e.clientY-r.top-56,l=Math.hypot(x,y),k=Math.min(32,l)/(l||1);nub.style.transform='translate('+x*k+'px,'+y*k+'px)';keys.w=y< -10;keys.s=y>10;keys.a=x< -10;keys.d=x>10}function endJoy(){joyId=null;keys.w=keys.a=keys.s=keys.d=false;nub.style.transform=''}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
updateHud();
})();
