<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101a17">
  <meta name="description" content="HERO WORLD — 原创离线竖屏动作角色扮演游戏">
  <title>HERO WORLD · 传奇</title>
  <style>
:root{color-scheme:dark;--gold:#d8b878;--gold2:#f1dca9;--panel:rgba(18,29,25,.94);--line:rgba(218,190,137,.5);--muted:#b5c2b1;--red:#c95b4d;--green:#79b879}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a17;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f5f0df;touch-action:none;user-select:none;-webkit-user-select:none}
#game-shell{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:#17261e;isolation:isolate}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-top{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.player-card{display:flex;gap:9px;align-items:center;width:min(72%,390px);padding:8px 10px;background:linear-gradient(110deg,rgba(12,22,19,.94),rgba(25,39,31,.84));border:1px solid var(--line);border-radius:13px;box-shadow:0 5px 18px #07100c80;pointer-events:auto}
.avatar-frame{width:48px;height:52px;flex:none;border:1px solid #c6a86e;border-radius:9px;background:#35453a;overflow:hidden;display:grid;place-items:center}.avatar-frame img{width:100%;height:100%;object-fit:contain}
.player-info{min-width:0;flex:1}.name-line{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:12px}.name-line strong{font-size:14px;white-space:nowrap}.name-line span{font-size:10px;color:var(--gold2)}.class-tag{padding:2px 5px;border-radius:5px;background:#7d5835;color:#fff!important}
.bar-row{display:flex;align-items:center;gap:5px;height:12px;font-size:9px;color:#e5d9b9}.bar-row>span{width:25px}.bar{height:7px;flex:1;border-radius:9px;background:#111b17;overflow:hidden;border:1px solid #526257}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a33d38,#e77c63);border-radius:9px;transition:width .18s}.xp-row .bar i{background:linear-gradient(90deg,#9d7a37,#e6c66f)}.bar-row small{font-size:9px;min-width:52px;text-align:right;color:#d3d6c4}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}.region-pill,.icon-button{background:rgba(15,27,22,.88);border:1px solid var(--line);border-radius:9px;color:var(--gold2);padding:7px 10px;font-size:11px;box-shadow:0 4px 12px #07100c66}.icon-button{padding:5px 10px}
.world-toast{position:absolute;z-index:5;top:19%;left:50%;transform:translate(-50%,-8px);opacity:0;transition:.2s;background:#111d18eF;border:1px solid var(--line);padding:9px 15px;border-radius:9px;font-size:12px;white-space:nowrap;pointer-events:none}.world-toast.show{opacity:1;transform:translate(-50%,0)}
.quest-chip{position:absolute;z-index:2;top:105px;left:13px;display:flex;gap:8px;align-items:center;max-width:70%;padding:7px 11px;border-radius:9px;background:#14231dcc;border:1px solid #b99b625c;box-shadow:0 4px 12px #07100c44;pointer-events:none}.quest-mark{color:#e5c77d;font-size:17px}.quest-chip b{display:block;font-size:11px;color:#f1dba8}.quest-chip small{display:block;margin-top:2px;font-size:10px;color:#c1cbb9}
.bottom-hud{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 12px max(8px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(9,17,14,.96) 0%,rgba(12,22,18,.86) 74%,transparent 100%);pointer-events:none}
.resource-line{height:32px;display:flex;align-items:center;gap:13px;padding:0 4px;font-size:11px;color:#e7d5aa;pointer-events:auto}.resource-line span:last-of-type{color:#b8c7b3;font-size:10px}.small-button{margin-left:auto;background:#5b704d;border:1px solid #c6b07b;color:#fff2ce;border-radius:7px;padding:5px 14px;font-weight:700}
.combat-controls{height:116px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.joystick-hint{font-size:10px;color:#e3e5d1a8;margin-left:5px;align-self:flex-end;margin-bottom:12px}.action-cluster{display:flex;align-items:flex-end;gap:8px;pointer-events:auto}
.action-button{position:relative;width:54px;height:54px;border-radius:50%;border:1.5px solid #d7bd83;background:radial-gradient(circle at 35% 25%,#617b61,#263d31 68%,#17261e);color:#fff0cf;box-shadow:0 4px 8px #0008,inset 0 1px 5px #ffffff30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0}
.action-button span{font-size:20px;line-height:24px;font-weight:800;text-shadow:0 2px 3px #000}.action-button small{font-size:9px;line-height:13px;color:#f2e5c7}.attack-button{width:68px;height:68px;background:radial-gradient(circle at 35% 25%,#d07c57,#7d302d 72%,#421e23);border-color:#f0c58e}.attack-button span{font-size:28px}.skill-button{background:radial-gradient(circle at 35% 25%,#7783a1,#343c63 72%,#20233e)}.potion-button{background:radial-gradient(circle at 35% 25%,#c26a72,#713542 72%,#3d202a)}.auto-button.active{background:radial-gradient(circle at 35% 25%,#b4a05e,#65713b 72%,#343c20);box-shadow:0 0 14px #d8c16a77}
.action-button:active,.small-button:active,.bottom-nav button:active{filter:brightness(1.35);transform:scale(.96)}.action-button em{position:absolute;inset:0;border-radius:50%;background:#101b1bd9;display:none;align-items:center;justify-content:center;font-style:normal;font-size:13px}.action-button.cooling em{display:flex}
.bottom-nav{height:42px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #bba16c55;pointer-events:auto}.bottom-nav button{border:0;background:transparent;color:#c9d0bf;font-size:11px;padding:8px 13px}.bottom-nav button:focus-visible,button:focus-visible{outline:2px solid #e8cb8b;outline-offset:2px}
.target-banner{position:absolute;z-index:3;top:160px;left:50%;transform:translateX(-50%);width:min(62%,300px);padding:7px 11px;background:#111d19e8;border:1px solid #c99d6b88;border-radius:8px;text-align:center;pointer-events:none}.target-banner span{font-size:11px;color:#f1d8ad}.target-bar{height:6px;background:#301e1d;border-radius:8px;margin:5px 0;overflow:hidden}.target-bar i{display:block;height:100%;background:#c95b4d;width:100%}.target-banner small{font-size:9px;color:#d7c8ad}
.modal{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#050b09b8;backdrop-filter:blur(5px);pointer-events:auto}.modal.hidden,.hidden{display:none}.modal-card{width:min(100%,480px);max-height:min(78dvh,760px);overflow:auto;background:linear-gradient(145deg,#24352d,#121e19);border:1px solid #c7a76c;border-radius:15px;box-shadow:0 18px 60px #000b;padding:15px}.modal-card header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #b89b624f;padding-bottom:9px;margin-bottom:12px}.modal-card h2{font-size:17px;color:#f0d69d;margin:0}.modal-card header button{border:0;background:#493a2e;color:#f6e7c8;border-radius:8px;width:30px;height:30px;font-size:22px}
.panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat-card,.item-card,.quest-card{padding:10px;border:1px solid #9b8b6455;background:#192820;border-radius:9px}.stat-card b,.item-card b{display:block;color:#e7cf98;font-size:12px;margin-bottom:4px}.stat-card span,.item-card small{font-size:11px;color:#c2cebd}.panel-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.panel-actions button,.item-card button,.quest-card button{border:1px solid #b99b66;background:#5b704d;color:#fff1d1;border-radius:7px;padding:8px 11px;font-size:11px}.item-list{display:grid;gap:7px}.item-card{display:flex;justify-content:space-between;align-items:center;gap:8px}.item-card button{flex:none}.empty-note{color:#b7c2b1;font-size:12px;padding:18px;text-align:center}.quest-card p{font-size:12px;color:#c8d0c0;line-height:1.6}.class-choice{display:flex;gap:7px}.class-choice button{flex:1}
@media(min-width:700px){#game-shell{max-width:520px;margin:auto;border-left:1px solid #435349;border-right:1px solid #435349}.hud-top{left:14px;right:14px}.bottom-hud{padding-left:16px;padding-right:16px}}
@media(max-height:700px){.quest-chip{top:92px}.combat-controls{height:94px}.action-button{width:47px;height:47px}.attack-button{width:60px;height:60px}.resource-line{height:27px}.bottom-nav{height:36px}.player-card{padding:6px}.avatar-frame{width:42px;height:44px}}

#npc-button:disabled{opacity:.55;filter:saturate(.5)}

.npc-dialogue{padding:12px 13px;margin-bottom:10px;border:1px solid #b99b6277;border-radius:10px;background:linear-gradient(120deg,#3a3829,#202c24)}.npc-dialogue b{display:block;color:#f0d69d;font-size:12px;margin-bottom:5px}.npc-dialogue p{margin:0;color:#e4ddc8;font-size:12px;line-height:1.65}

</style>
</head>

const KEY="hero-world-html5-save-v1";
const SAVE_VERSION=5;

function loadSave(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!data||typeof data!=="object")return null;
    if(data.version===1||data.version===2||data.version===3||data.version===4)return {...data,version:SAVE_VERSION};
    return data.version===SAVE_VERSION?data:null;
  }catch(error){
    console.warn("Save data could not be read",error);
    return null;
  }
}

function writeSave(state){
  const payload={
    version:SAVE_VERSION,
    level:state.level,exp:state.exp,gold:state.gold,potions:state.potions,hp:state.hp,classId:state.classId,
    x:state.player.x,y:state.player.y,kills:state.kills,questKills:state.questKills,skillPoints:state.skillPoints,
    questAccepted:state.questAccepted,questClaimed:state.questClaimed,deepwoodQuestAccepted:state.deepwoodQuestAccepted,deepwoodQuestClaimed:state.deepwoodQuestClaimed,deepwoodEntered:state.deepwoodEntered,deepwoodEliteKills:state.deepwoodEliteKills,questMaterials:state.questMaterials,inventory:state.inventory,equipment:state.equipment,
    skillLevel:state.skillLevel,gearSequence:state.gearSequence,region:state.region,
    enemies:state.enemies.map(enemy=>({...enemy})),
    drops:state.drops.map(drop=>({...drop,item:drop.item?{...drop.item}:undefined}))
  };
  try{
    localStorage.setItem(KEY,JSON.stringify(payload));
    return true;
  }catch(error){
    console.warn("Save failed",error);
    return false;
  }
}

}
if(type==="shop"){
  html='<div class="npc-dialogue"><b>老铁匠</b><p>冒险路上，趁手的武器和结实的护甲能救你的命。带够金币再来。</p></div><div class="item-list">'+SHOP_ITEMS.map(item=>'<div class="item-card"><div><b>'+item.name+'</b><small>'+item.description+' · '+item.price+' 金币</small></div><button data-buy="'+item.id+'" '+(game.gold<item.price?'disabled':'')+'>购买</button></div>').join("")+'</div><p class="empty-note">当前金币：'+game.gold+' · 装备购买后放入背包，药水直接增加库存。</p>';
}
if(type==="skills"){html='<div class="quest-card"><b>'+s.klass.skill+'</b><p>当前技能等级 '+game.skillLevel+'/5。技能会随等级提升获得更强效果。当前技能点：'+game.skillPoints+'。</p><div class="panel-actions"><button id="skill-upgrade">技能升级（消耗 1 点）</button></div></div><div class="panel-actions class-choice">'+Object.entries(CLASSES).map(([id,c])=>'<button data-class="'+id+'">'+c.name+'</button>').join("")+"</div>";}
if(type==="quest"){
  const nearElder=game.nearbyNpc?.id==="village_elder";
  const firstDone=game.questClaimed;
  const secondStage=game.deepwoodQuestClaimed?"密林威胁已解除，村长已开放古代遗迹的调查线索。":!game.deepwoodQuestAccepted?"完成第一条主线并达到 Lv.3 后，可接取密林委托。":!game.deepwoodEntered?"前往幽暗密林，调查异常踪迹。":game.deepwoodEliteKills<1?"击败密林头目，取得腐化树皮。":game.questMaterials<DEEPWOOD_QUEST.materialCount?"精英已击败，拾取腐化树皮后返回村长。":"目标已完成，返回村庄找村长交付。";
  const firstDialogue=game.questClaimed?"第一份委托你完成得很好。":!game.questAccepted?"林间入口附近出现了森林劫掠者。请替村民清理 3 名劫掠者。":game.questKills<3?"森林劫掠者仍在骚扰村民。继续清理。":"你已经完成委托！请把这份奖励收下。";
  const secondDialogue=game.deepwoodQuestClaimed?"密林的威胁暂时解除，收下这份守护者装备。":!game.deepwoodQuestAccepted?"幽暗密林最近出现了强大的头目。达到 Lv.3 并完成前一项委托后，我会交给你新的任务。":"密林深处的头目携带腐化树皮。先进入密林，再击败头目并带回 3 份树皮。";
  html='<div class="npc-dialogue"><b>守林村长</b><p>'+firstDialogue+'</p></div><div class="quest-card"><b>主线一 · 清理林间</b><p>击败森林劫掠者：'+Math.min(3,game.questKills)+' / 3</p><p>奖励：80 经验、60 金币、巡林者徽记</p><div class="panel-actions"><button id="quest-talk">与村长交谈</button><button id="quest-action">'+(game.questClaimed?"已完成":game.questAccepted?(game.questKills>=3?"交付任务":"任务进行中"):"接取任务")+'</button></div></div><div class="quest-card"><b>主线二 · 幽暗密林的威胁</b><p>'+secondDialogue+'</p><p>阶段：'+secondStage+'</p><p>目标 1：进入幽暗密林 '+(game.deepwoodEntered?"✓":"未完成")+'</p><p>目标 2：击败密林头目 '+Math.min(1,game.deepwoodEliteKills)+' / 1</p><p>目标 3：收集腐化树皮 '+Math.min(DEEPWOOD_QUEST.materialCount,game.questMaterials)+' / '+DEEPWOOD_QUEST.materialCount+'</p><p>奖励：180 经验、160 金币、密林守护甲</p><div class="panel-actions"><button id="deepwood-accept" '+(!firstDone||game.level<3||game.deepwoodQuestAccepted?'disabled':'')+'>接取密林委托</button><button id="deepwood-claim" '+(!game.deepwoodQuestAccepted||!game.deepwoodEntered||game.deepwoodEliteKills<1||game.questMaterials<DEEPWOOD_QUEST.materialCount||game.deepwoodQuestClaimed?'disabled':'')+'>'+(game.deepwoodQuestClaimed?"已完成":"交付密林委托")+'</button></div></div>';
}
if(type==="map"){const regions=[{id:"village",name:"守林新手村",level:1},{id:"entrance",name:"林间入口",level:1},{id:"deepwood",name:"幽暗密林",level:3},{id:"ruins",name:"古代遗迹",level:5},{id:"altar",name:"遗忘祭坛",level:8}];html='<div class="item-list">'+regions.map((region,i)=>{const unlocked=s.level>=region.level;return '<div class="item-card"><b>'+region.name+' · Lv.'+region.level+'</b><small>'+(unlocked?(region.id===s.region?"当前区域 · 已开放":"已开放 · 可探索"):"未解锁 · 角色达到 Lv."+region.level+" 开放")+'</small></div>'}).join("")+'</div><p class="empty-note">区域怪物只在对应区域激活；离开后暂停行动与刷新计时。</p>';}
$("modal-content").innerHTML=html;$("modal").classList.remove("hidden");
$("modal-content").querySelectorAll("[data-class]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.class;game.switchClass(id);openPanel(type)}));
$("modal-content").querySelectorAll("[data-buy]").forEach(b=>b.addEventListener("click",()=>{game.buyShopItem(b.dataset.buy);openPanel(type)}));
$("modal-content").querySelectorAll("[data-equip]").forEach(b=>b.addEventListener("click",()=>{game.equipItem(Number(b.dataset.equip));openPanel(type)}));$("modal-content").querySelectorAll("[data-unequip]").forEach(b=>b.addEventListener("click",()=>{game.unequipItem(b.dataset.unequip);openPanel(type)}));
$("skill-upgrade")?.addEventListener("click",()=>{if(game.upgradeSkill())openPanel(type);else game.toast("技能点不足或技能已满级")});
$("quest-talk")?.addEventListener("click",()=>{const npc=game.nearbyNpc;if(npc?.id==="village_elder")game.interactNpc(npc.id);else game.toast("守林村长位于新手村中央，返回村庄靠近他");openPanel(type)});
$("quest-action")?.addEventListener("click",()=>{if(!game.questAccepted)game.acceptQuest();else game.claimQuest();openPanel(type)});
$("deepwood-accept")?.addEventListener("click",()=>{game.acceptDeepwoodQuest();openPanel(type)});
$("deepwood-claim")?.addEventListener("click",()=>{game.claimDeepwoodQuest();openPanel(type)});
}
function card(label,value){return '<div class="stat-card"><b>'+label+'</b><span>'+value+'</span></div>'}
window.addEventListener("beforeunload",()=>game.save());

</script>
</body>
</html>
