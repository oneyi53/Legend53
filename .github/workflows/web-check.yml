name: HTML5 runtime check
on:
  push:
    branches: [main, "feat/pure-html5-runtime-2026-11-07"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax and required assets
        run: |
          test -s index.html
          test -s web/styles.css
          test -s web/game.js
          grep -q 'type="module"' index.html
          node --check web/game.js
          node --check web/smoke-test.mjs
          test -s assets/characters/warrior.svg
          test -s assets/characters/mage.svg
          test -s assets/characters/taoist.svg
          test -s assets/monsters/forest_beast.svg
          test -s assets/monsters/ancient_tree_boss.svg
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8000 >/tmp/hero-world-web.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
      - name: Run browser smoke test
        run: node web/smoke-test.mjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-world-html5-browser-qa
          path: artifacts/html5-browser/
          if-no-files-found: warn
          retention-days: 14
