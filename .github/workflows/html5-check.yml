name: HTML5 game checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in web/js/*.js tests/*.js; do
            node --check "$file"
          done
      - name: Run gameplay unit tests
        run: npm test
      - name: Validate HTML and local assets
        run: python3 scripts/qa/check_html.py
