<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101a17">
  <meta name="description" content="HERO WORLD — 原创离线竖屏动作角色扮演游戏">
  <title>HERO WORLD · 传奇</title>
  <link rel="stylesheet" href="./web/css/game.css">
</head>
<body>
  <main id="game-shell" aria-label="HERO WORLD 游戏">
    <canvas id="game-canvas" aria-label="游戏场景"></canvas>
    <header class="hud-top">
      <section class="player-card">
        <div class="avatar-frame"><img src="./assets/characters/warrior.svg" alt="战士" id="avatar"></div>
        <div class="player-info">
          <div class="name-line"><strong id="player-name">无名旅者</strong><span id="level-label">Lv.1</span><span class="class-tag" id="class-label">战士</span></div>
          <div class="bar-row"><span>HP</span><div class="bar"><i id="hp-fill"></i></div><small id="hp-value">135/135</small></div>
          <div class="bar-row xp-row"><span>EXP</span><div class="bar"><i id="xp-fill"></i></div><small id="xp-value">0/100</small></div>
        </div>
      </section>
      <div class="top-right"><div class="region-pill" id="region-label">守林新手村</div><button class="icon-button" id="save-button" title="保存">存档</button></div>
    </header>
    <div class="world-toast" id="toast" role="status"></div>
    <section class="quest-chip" id="quest-chip"><span class="quest-mark">✦</span><div><b id="quest-title">初入森林</b><small id="quest-progress">与守林村长交谈</small></div></section>
    <section class="bottom-hud">
      <div class="resource-line"><span>◈ <b id="gold-value">100</b></span><span>✧ <b id="potion-value">3</b></span><span id="zone-level">推荐 Lv.1</span><button id="npc-button" class="small-button">交谈</button><button id="bag-button" class="small-button">背包</button></div>
      <div class="combat-controls">
        <div class="joystick-hint" id="joystick-hint">拖动屏幕空白处移动</div>
        <div class="action-cluster">
          <button class="action-button auto-button" id="auto-button"><span>自</span><small>自动</small></button>
          <button class="action-button potion-button" id="potion-button"><span>药</span><small>药水</small></button>
          <button class="action-button skill-button" id="skill-button"><span>✦</span><small id="skill-name">旋风斩</small><em id="skill-cooldown"></em></button>
          <button class="action-button attack-button" id="attack-button"><span>⚔</span><small>攻击</small></button>
        </div>
      </div>
      <nav class="bottom-nav"><button data-panel="character">角色</button><button data-panel="inventory">装备</button><button data-panel="skills">技能</button><button data-panel="quest">任务</button><button data-panel="map">地图</button></nav>
    </section>
    <section class="modal hidden" id="modal" aria-modal="true" role="dialog">
      <div class="modal-card"><header><h2 id="modal-title">角色</h2><button id="close-modal" aria-label="关闭">×</button></header><div id="modal-content"></div></div>
    </section>
    <div class="target-banner hidden" id="target-banner"><span id="target-name">森林劫掠者</span><div class="target-bar"><i id="target-fill"></i></div><small id="target-health"></small></div>
  </main>
  <script type="module" src="./web/js/main.js"></script>
</body>
</html>
